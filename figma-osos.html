<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Osos - Figma</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
      gap: 40px;
      padding: 40px;
    }

    h1 {
      color: #fff;
      font-size: 1.5rem;
      letter-spacing: 2px;
    }

    .canvas {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
      align-items: flex-end;
    }

    .figura {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .figura span {
      color: #aaa;
      font-size: 0.8rem;
    }

    /* oso 1 — rounded-rectangle 219×350 */
    .oso-1 {
      width: 219px;
      height: 350px;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
    }

    /* Ellipse 1 — círculo 153×141 */
    .ellipse-1 {
      width: 153px;
      height: 141px;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
    }

    /* Ellipse 2 — vector 140×175 */
    .ellipse-2 {
      width: 140px;
      height: 175px;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      overflow: hidden;
      position: relative;
    }

    /* Rectangle 1 — 100×100 */
    .rect-1 {
      width: 100px;
      height: 100px;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }

    .figura img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>

  <h1>OSOS EN FIGMA</h1>

  <div class="canvas">

    <!-- Figura original -->
    <div class="figura">
      <div class="oso-1">
        <img src="https://www.figma.com/api/mcp/asset/a2a19b87-6297-4fe4-a403-fbc2a2507910.png" alt="oso 1" />
      </div>
      <span>oso 1 (original)</span>
    </div>

    <!-- Ellipse 1 — copia del oso -->
    <div class="figura">
      <div class="ellipse-1">
        <img src="https://www.figma.com/api/mcp/asset/a2a19b87-6297-4fe4-a403-fbc2a2507910.png" alt="oso en elipse 1" />
      </div>
      <span>Ellipse 1</span>
    </div>

    <!-- Ellipse 2 — copia del oso -->
    <div class="figura">
      <div class="ellipse-2">
        <img src="https://www.figma.com/api/mcp/asset/a2a19b87-6297-4fe4-a403-fbc2a2507910.png" alt="oso en elipse 2" />
      </div>
      <span>Ellipse 2</span>
    </div>

    <!-- Rectangle 1 — copia del oso -->
    <div class="figura">
      <div class="rect-1">
        <img src="https://www.figma.com/api/mcp/asset/a2a19b87-6297-4fe4-a403-fbc2a2507910.png" alt="oso en rectangle 1" />
      </div>
      <span>Rectangle 1</span>
    </div>

  </div>

</body>
</html>
