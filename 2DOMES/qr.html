<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Generador QR 💕</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --rose: #e8507a;
      --pink: #f9c6d0;
      --deep: #3a0a1e;
      --gold: #d4a24c;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% 30%, #7a1040 0%, var(--deep) 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      padding: 2rem;
    }

    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(232,80,122,0.3);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 480px;
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }

    .card h1 {
      font-size: 1.8rem;
      color: var(--pink);
      margin-bottom: 0.4rem;
    }

    .card p.sub {
      font-size: 0.85rem;
      color: var(--gold);
      letter-spacing: 0.1em;
      margin-bottom: 1.8rem;
    }

    .input-wrap {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      border: 1px solid rgba(232,80,122,0.4);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]::placeholder { color: rgba(255,255,255,0.35); }
    input[type="text"]:focus { border-color: var(--rose); }

    button {
      padding: 0.75rem 1.4rem;
      background: var(--rose);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      white-space: nowrap;
    }
    button:hover { background: #c73d65; transform: scale(1.03); }

    /* QR box */
    #qr-wrap {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      animation: fadeUp 0.4s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    #qr-wrap.visible { display: flex; }

    #qr-box {
      background: #fff;
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(232,80,122,0.4);
      display: inline-block;
    }

    #qr-url {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.5);
      word-break: break-all;
      max-width: 320px;
    }

    #download-btn {
      background: transparent;
      border: 1px solid var(--rose);
      color: var(--pink);
      font-size: 0.9rem;
      padding: 0.6rem 1.6rem;
      border-radius: 50px;
      margin-top: 0.2rem;
    }
    #download-btn:hover { background: var(--rose); color: #fff; }

    #error-msg {
      display: none;
      color: #ff6b8a;
      font-size: 0.85rem;
      margin-top: -1rem;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
<div class="card">
  <h1>Generador QR 💕</h1>
  <p class="sub">Pega el link y obtén tu código QR</p>

  <div class="input-wrap">
    <input type="text" id="url-input" placeholder="https://..." autocomplete="off" spellcheck="false"/>
    <button id="gen-btn">Generar</button>
  </div>

  <p id="error-msg">⚠️ Ingresa un link válido</p>

  <div id="qr-wrap">
    <div id="qr-box"></div>
    <p id="qr-url"></p>
    <button id="download-btn">⬇ Descargar PNG</button>
  </div>
</div>

<script>
  const input      = document.getElementById('url-input');
  const genBtn     = document.getElementById('gen-btn');
  const qrWrap     = document.getElementById('qr-wrap');
  const qrBox      = document.getElementById('qr-box');
  const qrUrl      = document.getElementById('qr-url');
  const dlBtn      = document.getElementById('download-btn');
  const errorMsg   = document.getElementById('error-msg');
  let qrInstance   = null;

  function generate() {
    const url = input.value.trim();

    // Validación básica
    if (!url || (!url.startsWith('http://') && !url.startsWith('https://'))) {
      errorMsg.style.display = 'block';
      qrWrap.classList.remove('visible');
      return;
    }
    errorMsg.style.display = 'none';

    // Limpiar QR anterior
    qrBox.innerHTML = '';
    qrWrap.classList.remove('visible');

    qrInstance = new QRCode(qrBox, {
      text:         url,
      width:        220,
      height:       220,
      colorDark:    '#3a0a1e',
      colorLight:   '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });

    qrUrl.textContent = url;
    qrWrap.classList.add('visible');
  }

  genBtn.addEventListener('click', generate);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') generate(); });

  // Descargar como PNG
  dlBtn.addEventListener('click', () => {
    const canvas = qrBox.querySelector('canvas');
    if (!canvas) return;
    const link = document.createElement('a');
    link.download = 'qr-2domes.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
</script>
</body>
</html>
